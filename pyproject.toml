[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "udsdiag"
dynamic = ["version"]
description = "An offline model of the UDS (ISO 14229-1) and GM GMLAN diagnostic services: the service and negative-response-code catalogs, a request/response codec, and the DID, DTC, Mode $06, RoutineControl, IOControl and SecurityAccess reference catalogs read from a GM head-unit and app assessment. It encodes and decodes diagnostic messages; it does not open a bus, derive a key, or write to a vehicle."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "Justin Capella" }]
keywords = ["uds", "iso14229", "gmlan", "obd", "dtc", "diagnostics"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy"]

[project.scripts]
udsdiag = "udsdiag.cli:main"

[tool.hatch.version]
path = "udsdiag/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["udsdiag"]

[tool.hatch.build.targets.sdist]
include = ["/udsdiag/", "/tests/", "/docs/", "/README.md", "/ROADMAP.md", "/PLAN.md", "/LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "N", "UP", "SIM", "C4", "PT", "RUF", "S", "RET", "ARG"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "PT011"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
