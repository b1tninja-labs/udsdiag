[package]
name = "udskit"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Offline UDS (ISO 14229-1) and GM GMLAN diagnostic services: catalogs, PDU codec, reference data, read-only CLI"
license = "Apache-2.0"
readme = "README.md"
publish = false # offline reference library; not published

[features]
# The GM/GMLAN vendor layer (services, addressing, and the GMG3 reference catalogs). On by
# default; `--no-default-features` gives a pure ISO 14229-1 core with no GM data linked.
default = ["gm"]
gm = []

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# A reference/catalog crate: the prose carries protocol terms (ReadDataByIdentifier, GMLAN,
# ISO names) that doc_markdown would want in backticks, many pure accessors over const tables,
# and type names that echo their module (did::Did, dtc::Dtc). These pedantic lints only add
# noise here, so they are allowed in the manifest rather than with scattered #![allow].
must_use_candidate = "allow"
missing_errors_doc = "allow"
module_name_repetitions = "allow"
doc_markdown = "allow"
